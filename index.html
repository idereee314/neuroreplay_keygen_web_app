<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeuroReplay Keygen</title>
<link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
/* Reset & Base */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #15121f;
  --surface:  #1c1830;
  --panel:    #241f3d;
  --border:   rgba(255,255,255,.09);
  --border2:  rgba(255,255,255,.16);
  --text:     #ede9f7;
  --muted:    #9089ae;
  --accent:   #7c5cfc;
  --accent2:  #ec4899;
  --green:    #10d98a;
  --amber:    #f59e0b;
  --red:      #ef4444;
  --font-ui:  'Syne', sans-serif;
  --font-mono:'JetBrains Mono', monospace;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  overflow: hidden;
}

/* Background grid */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(124,92,252,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(124,92,252,.03) 1px, transparent 1px);
  background-size: 32px 32px;
  pointer-events: none;
  z-index: 0;
}

/* Login Screen */
#loginScreen {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
  background: var(--bg);
}

.login-card {
  width: 380px;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 16px;
  padding: 36px 32px;
  position: relative;
  box-shadow: 0 0 80px rgba(124,92,252,.08), 0 32px 64px rgba(0,0,0,.6);
}

.login-card::before {
  content: '';
  position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 120px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
}

.login-logo {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 28px;
}
.login-logo img {
  height: 52px; width: auto; flex-shrink: 0;
}
.login-logo h1 {
  font-size: 16px; font-weight: 800; letter-spacing: -.01em;
}
.login-logo p {
  font-size: 10px; color: var(--muted); font-family: var(--font-mono);
  letter-spacing: .08em; text-transform: uppercase;
}

.login-title {
  font-size: 22px; font-weight: 800; margin-bottom: 6px;
  background: linear-gradient(135deg, #ede9f7 0%, #b3a6e8 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.login-sub {
  font-size: 12px; color: var(--muted); margin-bottom: 28px;
  font-family: var(--font-mono);
}

.l-field { margin-bottom: 14px; }
.l-field label {
  display: block; font-size: 10px; font-weight: 700;
  color: var(--muted); text-transform: uppercase; letter-spacing: .08em;
  margin-bottom: 6px;
}
.l-field input {
  width: 100%; padding: 10px 13px;
  background: rgba(255,255,255,.04);
  border: 1px solid var(--border);
  border-radius: 8px; color: var(--text);
  font-family: var(--font-mono); font-size: 13px;
  outline: none; transition: border-color .15s, box-shadow .15s;
}
.l-field input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(124,92,252,.12);
}

.login-btn {
  width: 100%; padding: 12px;
  background: linear-gradient(135deg, #7c5cfc, #ec4899);
  color: #fff; border: none; border-radius: 8px;
  font-family: var(--font-ui); font-size: 13px; font-weight: 700;
  cursor: pointer; margin-top: 8px;
  transition: opacity .15s, transform .1s;
  letter-spacing: .02em;
}
.login-btn:hover { opacity: .9; transform: translateY(-1px); }
.login-btn:active { transform: translateY(0); }
.login-btn:disabled { opacity: .5; cursor: default; transform: none; }

.login-err {
  margin-top: 12px; font-size: 11px; color: var(--red);
  font-family: var(--font-mono); min-height: 16px; text-align: center;
}

/* App Shell */
#appShell {
  display: none;
  height: 100vh;
  flex-direction: column;
  position: relative; z-index: 1;
  max-width: 560px;
  margin: 0 auto;
}

/* Header */
.header {
  display: flex; align-items: center; gap: 10px;
  padding: 13px 20px 11px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  background: rgba(21,18,31,.8);
  backdrop-filter: blur(8px);
}
.header .dot {
  height: 36px; width: auto; flex-shrink: 0;
}
.header-text h1 { font-size: 14px; font-weight: 800; letter-spacing: -.01em; }
.header-text p  { font-size: 10px; color: var(--muted); font-family: var(--font-mono); letter-spacing: .06em; }

.header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

.warn-badge {
  font-size: 10px; color: var(--amber);
  background: rgba(245,158,11,.07);
  border: 1px solid rgba(245,158,11,.18);
  border-radius: 4px; padding: 2px 8px;
  font-family: var(--font-mono);
}

.user-info {
  display: flex; align-items: center; gap: 7px;
}
.user-email {
  font-size: 10px; color: var(--muted); font-family: var(--font-mono);
  max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.logout-btn {
  font-size: 10px; color: var(--muted);
  background: rgba(255,255,255,.04);
  border: 1px solid var(--border); border-radius: 4px;
  padding: 3px 8px; cursor: pointer;
  font-family: var(--font-ui); font-weight: 600;
  transition: color .12s, border-color .12s;
}
.logout-btn:hover { color: var(--red); border-color: rgba(239,68,68,.3); }

.lang-switch {
  display: flex; border: 1px solid var(--border); border-radius: 4px;
  overflow: hidden; flex-shrink: 0;
}
.lang-btn {
  font-size: 10px; font-weight: 700; color: var(--muted);
  background: transparent; border: none; cursor: pointer;
  padding: 3px 7px; font-family: var(--font-mono);
  letter-spacing: .04em; transition: color .12s, background .12s;
}
.lang-btn.active { color: #fff; background: var(--accent); }
.lang-btn:not(.active):hover { color: var(--text); }

/* Tabs */
.tabs {
  display: flex; border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  background: rgba(21,18,31,.6);
}
.tab {
  flex: 1; padding: 10px; text-align: center;
  font-size: 11px; font-weight: 700; color: var(--muted);
  cursor: pointer; border-bottom: 2px solid transparent;
  transition: all .15s; letter-spacing: .04em; text-transform: uppercase;
  font-family: var(--font-mono);
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* Tab content */
.tab-content { display: none; flex: 1; overflow-y: auto; flex-direction: column; }
.tab-content.active { display: flex; }
.form { padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; flex: 1; }

/* Fields */
.field label {
  display: block; font-size: 10px; font-weight: 700;
  color: var(--muted); text-transform: uppercase; letter-spacing: .08em;
  margin-bottom: 5px; font-family: var(--font-mono);
}
.field input[type=text], .field input[type=date] {
  width: 100%; padding: 9px 12px;
  background: rgba(255,255,255,.04);
  border: 1px solid var(--border);
  border-radius: 7px; color: var(--text);
  font-size: 13px; font-family: var(--font-mono);
  outline: none; transition: border-color .15s, box-shadow .15s;
}
.field input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(124,92,252,.1);
}
.field input.error { border-color: var(--red); box-shadow: 0 0 0 3px rgba(239,68,68,.08); }

.date-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.presets { display: flex; gap: 5px; margin-top: 5px; }
.presets span { font-size: 10px; color: var(--muted); align-self: center; font-family: var(--font-mono); }
.preset {
  padding: 3px 10px;
  border: 1px solid var(--border);
  border-radius: 999px; background: transparent;
  color: var(--muted); font-size: 11px; cursor: pointer;
  font-family: var(--font-mono); font-weight: 600;
  transition: all .12s;
}
.preset:hover { border-color: var(--accent); color: var(--text); background: rgba(124,92,252,.08); }

.err-msg { font-size: 11px; color: var(--red); min-height: 16px; font-family: var(--font-mono); }

/* Result boxes */
.result { display: none; border-radius: 9px; padding: 12px 14px; flex-shrink: 0; }
.result.show { display: block; }
.result-lic { background: rgba(16,217,138,.05); border: 1px solid rgba(16,217,138,.2); }
.result-key { background: rgba(124,92,252,.05); border: 1px solid rgba(124,92,252,.2); }
.result-title { font-size: 11px; font-weight: 700; margin-bottom: 9px; letter-spacing: .04em; }
.result-lic .result-title { color: var(--green); }
.result-key .result-title { color: var(--accent); }
.rrow { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 4px; }
.rlabel {
  font-size: 10px; color: var(--muted); min-width: 70px;
  text-transform: uppercase; letter-spacing: .05em;
  font-family: var(--font-mono); padding-top: 1px;
}
.rval { font-size: 11px; color: var(--text); flex: 1; word-break: break-all; font-family: var(--font-mono); }
.rval.key-val { font-size: 12px; color: var(--accent); letter-spacing: .06em; }
.rval.path-val { color: var(--green); font-size: 11px; }

.copy-btn {
  margin-top: 9px; padding: 6px 14px;
  border: 1px solid rgba(124,92,252,.25);
  border-radius: 6px; background: rgba(124,92,252,.08);
  color: var(--accent); font-size: 11px; font-weight: 700;
  cursor: pointer; transition: all .12s; width: 100%;
  font-family: var(--font-mono);
}
.copy-btn:hover { background: rgba(124,92,252,.16); }
.copy-btn.copied { color: var(--green); border-color: rgba(16,217,138,.25); background: rgba(16,217,138,.06); }

.lic-dl-btn {
  margin-top: 7px; padding: 6px 14px;
  border: 1px solid rgba(16,217,138,.25);
  border-radius: 6px; background: rgba(16,217,138,.07);
  color: var(--green); font-size: 11px; font-weight: 700;
  cursor: pointer; transition: all .12s; width: 100%;
  font-family: var(--font-mono);
}
.lic-dl-btn:hover { background: rgba(16,217,138,.14); }

/* Generate button */
.gen-btn {
  width: 100%; padding: 12px;
  background: linear-gradient(135deg, #7c5cfc, #ec4899);
  color: #fff; border: none; border-radius: 9px;
  font-size: 13px; font-weight: 700; cursor: pointer;
  transition: opacity .15s, transform .1s;
  display: flex; align-items: center; justify-content: center; gap: 7px;
  flex-shrink: 0; font-family: var(--font-ui); letter-spacing: .02em;
}
.gen-btn:hover:not(:disabled) { opacity: .9; transform: translateY(-1px); }
.gen-btn:active:not(:disabled) { transform: translateY(0); }
.gen-btn:disabled { opacity: .45; cursor: default; }

/* History */
.hist-section { flex-shrink: 0; border-top: 1px solid var(--border); }
.hist-hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 20px; cursor: pointer; transition: background .1s;
}
.hist-hdr:hover { background: rgba(255,255,255,.025); }
.hist-title {
  font-size: 10px; font-weight: 700; color: var(--muted);
  text-transform: uppercase; letter-spacing: .08em;
  display: flex; align-items: center; gap: 5px;
  font-family: var(--font-mono);
}
.hist-actions { display: flex; gap: 4px; align-items: center; }
.hist-act-btn {
  font-size: 10px; color: var(--muted); background: transparent;
  border: none; cursor: pointer; padding: 2px 6px; font-family: var(--font-ui); font-weight: 600;
  transition: color .12s;
}
.hist-act-btn:hover { color: var(--text); }
.hist-act-btn.danger:hover { color: var(--red); }

.hist-body { max-height: 130px; overflow-y: auto; padding: 0 20px 8px; }
.hist-item {
  display: flex; align-items: center; gap: 7px;
  padding: 5px 7px; border-radius: 5px; font-size: 11px;
  border: 1px solid transparent; transition: background .1s;
}
.hist-item:hover { background: rgba(255,255,255,.03); border-color: var(--border); }
.hist-badge {
  font-size: 9px; padding: 1px 6px; border-radius: 3px;
  flex-shrink: 0; font-family: var(--font-mono); font-weight: 700; letter-spacing: .04em;
}
.hist-lic { background: rgba(16,217,138,.1); color: var(--green); }
.hist-key { background: rgba(124,92,252,.1); color: var(--accent); }
.hist-ev {
  flex: 1; font-weight: 600; color: #d7d2ec;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-family: var(--font-mono); font-size: 10px;
}
.hist-dt { color: var(--amber); font-size: 10px; flex-shrink: 0; font-family: var(--font-mono); }
.hist-user { color: var(--muted); font-size: 9px; flex-shrink: 0; font-family: var(--font-mono); }
.hist-empty { font-size: 11px; color: var(--muted); text-align: center; padding: 10px 0; font-family: var(--font-mono); }

.hist-key-row {
  display: flex; align-items: center; gap: 6px;
  width: 100%; padding: 3px 0 0 0;
}
.hist-key-val {
  font-family: var(--font-mono); font-size: 11px;
  color: var(--accent); letter-spacing: .06em;
  flex: 1; word-break: break-all;
}
.hist-copy-btn {
  background: transparent; border: none;
  cursor: pointer; font-size: 12px; padding: 2px 4px;
  opacity: .6; transition: opacity .12s; flex-shrink: 0;
}
.hist-copy-btn:hover { opacity: 1; }

.paid-check-label {
  display: flex; align-items: center; gap: 8px;
  cursor: pointer; user-select: none;
  font-family: var(--font-mono); font-size: 12px;
  color: var(--muted); padding: 4px 0;
}
.paid-check-label input[type=checkbox] {
  width: 15px; height: 15px; cursor: pointer;
  accent-color: var(--green);
}
.paid-check-label:has(input:checked) { color: var(--green); }

.lic-copy-part-btn {
  padding: 5px 12px;
  border: 1px solid rgba(16,217,138,.25);
  border-radius: 6px; background: rgba(16,217,138,.07);
  color: var(--green); font-size: 11px; font-weight: 700;
  cursor: pointer; transition: all .12s;
  font-family: var(--font-mono); flex: 1;
}
.lic-copy-part-btn:hover { background: rgba(16,217,138,.15); }
.lic-copy-part-btn.copied { color: var(--accent); border-color: rgba(124,92,252,.3); background: rgba(124,92,252,.07); }

.hist-meta {
  font-family: var(--font-mono); font-size: 10px;
  color: var(--muted); padding: 1px 0;
}
.hist-meta-notes {
  font-family: var(--font-mono); font-size: 10px;
  color: #7a7398; font-style: italic; padding: 1px 0;
}
.hist-paid-label {
  display: flex; align-items: center; gap: 5px;
  cursor: pointer; flex-shrink: 0;
  font-family: var(--font-mono); font-size: 10px;
  color: var(--muted); user-select: none;
}
.hist-paid-label:has(input:checked) { color: var(--green); }
.hist-paid-check {
  width: 13px; height: 13px; cursor: pointer;
  accent-color: var(--green);
}

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #362f52; border-radius: 2px; }

/* Toast */
#toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(60px);
  background: var(--panel); border: 1px solid var(--border2);
  border-radius: 8px; padding: 8px 18px;
  font-size: 12px; font-family: var(--font-mono);
  color: var(--text); z-index: 999;
  transition: transform .25s cubic-bezier(.34,1.56,.64,1);
  pointer-events: none; white-space: nowrap;
}
#toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div class="login-card">
    <div class="lang-switch" style="position:absolute;top:14px;right:14px">
      <button class="lang-btn" id="langBtnMn" onclick="setLang('mn')">MN</button>
      <button class="lang-btn" id="langBtnEn" onclick="setLang('en')">EN</button>
    </div>
    <div class="login-logo">
      <img src="assets/images/logo.png" alt="NeuroReplay" />
      <div>
        <h1>NeuroReplay Keygen</h1>
        <p data-i18n="subtitle">License Generator</p>
      </div>
    </div>
    <div class="login-title" data-i18n="loginTitle">Нэвтрэх</div>
    <!-- <div class="login-sub">// Зөвхөн Ideree дотоод хэрэглэгчид</div> -->

    <div class="l-field">
      <label data-i18n="email">И-мэйл</label>
      <input type="email" id="loginEmail" placeholder="user@ideree.mn" autocomplete="email" />
    </div>
    <div class="l-field">
      <label data-i18n="password">Нууц үг</label>
      <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password" />
    </div>

    <button class="login-btn" id="loginBtn" onclick="doLogin()" data-i18n="loginBtn">Нэвтрэх →</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- APP SHELL -->
<div id="appShell">

  <!-- Header -->
  <div class="header">
    <img class="dot" src="assets/images/logo.png" alt="NeuroReplay" />
    <div class="header-text">
      <h1>NeuroReplay Keygen</h1>
      <p data-i18n="subtitle">License Generator</p>
    </div>
    <div class="header-right">
      <!-- <div class="warn-badge">⚠ Ideree дотоод</div> -->
      <div class="lang-switch">
        <button class="lang-btn" id="langBtnMn2" onclick="setLang('mn')">MN</button>
        <button class="lang-btn" id="langBtnEn2" onclick="setLang('en')">EN</button>
      </div>
      <div class="user-info">
        <span class="user-email" id="userEmail"></span>
        <button class="logout-btn" onclick="doLogout()" data-i18n="logout">Гарах</button>
      </div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" id="tab1" onclick="switchTab(1)"><span data-i18n="tabLic">▸ .lic Файл</span></div>
    <div class="tab" id="tab2" onclick="switchTab(2)">⌘ License Key</div>
  </div>

  <!-- TAB 1: .lic file -->
  <div class="tab-content active" id="content1">
    <div class="form">
      <div class="field">
        <label data-i18n="eventName">Тэмцээний нэр</label>
        <input type="text" id="licEvent" data-i18n-ph="eventNamePh" placeholder="Тэмцээний нэрийг оруулна уу" />
      </div>
      <div class="date-row">
        <div class="field">
          <label data-i18n="startDate">Эхлэх огноо</label>
          <input type="date" id="licStart" />
        </div>
        <div class="field">
          <label data-i18n="endDate">Дуусах огноо</label>
          <input type="date" id="licEnd" />
        </div>
      </div>
      <div class="presets">
        <span data-i18n="quick">Хурдан:</span>
        <button class="preset" onclick="licAddDays(1)">+1</button>
        <button class="preset" onclick="licAddDays(3)">+3</button>
        <button class="preset" onclick="licAddDays(7)">+7</button>
        <button class="preset" onclick="licAddDays(30)">+30</button>
      </div>
      <div class="field">
        <label data-i18n="org">Байгууллага / Клуб</label>
        <input type="text" id="licOrg" data-i18n-ph="orgPh" placeholder="Байгууллагын нэр" />
      </div>
      <div class="date-row">
        <div class="field">
          <label data-i18n="phone">Утас</label>
          <input type="text" id="licPhone" placeholder="9911xxxx" />
        </div>
        <div class="field">
          <label data-i18n="email">И-мэйл</label>
          <input type="text" id="licEmail" placeholder="contact@club.mn" />
        </div>
      </div>
      <div class="field">
        <label data-i18n="notes">Тэмдэглэл</label>
        <input type="text" id="licNotes" data-i18n-ph="notesPh" placeholder="Нэмэлт мэдээлэл..." />
      </div>
      <div class="field">
        <label>Features</label>
        <div style="display:flex;gap:16px;margin-top:4px">
          <label class="paid-check-label"><input type="checkbox" id="licFeatCompetition" checked disabled /><span>Competition</span></label>
          <label class="paid-check-label"><input type="checkbox" id="licFeatAnalyze" /><span>Analyze</span></label>
        </div>
      </div>
      <label class="paid-check-label"><input type="checkbox" id="licIsPaid" onchange="toggleLicEmailSection()" /><span data-i18n="paid">Төлбөр төлсөн</span></label>

      <div class="err-msg" id="licErr"></div>
      <div class="result result-lic" id="licResult">
        <div class="result-title" data-i18n="licReady">// .lic файл бэлэн боллоо</div>
        <div class="rrow"><span class="rlabel">event</span><span class="rval" id="licResEvent"></span></div>

// calls the sign-license edge function with the user's access token
async function callSign(payload) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) throw new Error(t('errReLogin'));
  const res = await fetch(SIGN_FN_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${session.access_token}`,
      'apikey': SUPABASE_ANON,
    },
    body: JSON.stringify(payload),
  });
  const out = await res.json().catch(() => ({}));
  if (!res.ok || !out.token) throw new Error(out.error || `Signing failed (${res.status})`);
  return out.token; // base64 license token
}

async function generateLicBytes(event, start, end, features) {
  const token = await callSign({ type: 'lic', event, start, end, features });
  // The .lic file content is exactly the base64 token bytes (UTF-8).
  return new TextEncoder().encode(token);
}

async function generateKeyStr(hwid, start, end, features) {
  return await callSign({ type: 'key', hwid: hwid.toUpperCase(), start, end, features });
}

// Generate .lic
async function generateLic() {
  const event = document.getElementById('licEvent').value.trim();
  const start = document.getElementById('licStart').value;
  const end   = document.getElementById('licEnd').value;
  const err   = document.getElementById('licErr');
  const btn   = document.getElementById('licBtn');

  err.textContent = '';
  document.getElementById('licEvent').classList.remove('error');

  if (!event) {
    err.textContent = t('errNeedEventName');
    document.getElementById('licEvent').classList.add('error'); return;
  }
  if (!start || !end) { err.textContent = t('errNeedDates'); return; }
  if (end < start)    { err.textContent = t('errBadEndDate'); return; }

  const licOrg   = document.getElementById('licOrg').value.trim();
  const licPhone = document.getElementById('licPhone').value.trim();
  const licEmail = document.getElementById('licEmail').value.trim();
  const licNotes = document.getElementById('licNotes').value.trim();
  const licIsPaid = document.getElementById('licIsPaid').checked;
  const features = ['competition'];
  if (document.getElementById('licFeatAnalyze').checked) features.push('analyze');

  if (licIsPaid) {
    if (!licOrg) {
      err.textContent = t('errNeedOrg');
      document.getElementById('licOrg').classList.add('error'); return;
    }
    if (!licPhone) {
      err.textContent = t('errNeedPhone');
      document.getElementById('licPhone').classList.add('error'); return;
    }
    if (!licEmail) {
      err.textContent = t('errNeedEmail');
      document.getElementById('licEmail').classList.add('error'); return;
    }
  }

  btn.disabled = true; btn.textContent = t('generating');

  try {
    const bytes    = await generateLicBytes(event, start, end, features);
    const safe     = event.replace(/\s+/g,'_').replace(/[^a-zA-Z0-9_\-]/g,'');
    _licFilename   = `${safe}_${start}_${end}_neuroreplay.lic`;
    _licBlob       = new Blob([bytes], { type: 'application/octet-stream' });

    document.getElementById('licResEvent').textContent = event;
    document.getElementById('licResDates').textContent = `${start}  →  ${end}`;
    document.getElementById('licResSize').textContent  = `${bytes.length} bytes  ·  ${features.join(', ')}`;
    document.getElementById('licResult').className = 'result result-lic show';

    // Wire up download button
    const dlBtn = document.getElementById('licDlBtn');
    dlBtn.onclick = () => {
      const url = URL.createObjectURL(_licBlob);
      const a = document.createElement('a');
      a.href = url; a.download = _licFilename; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    };

    // Auto copy email subject + body to clipboard
    const emailSubject = t('emailSubject', licOrg, event);
    const emailBody = t('emailBody', { org: licOrg, phone: licPhone, start, end });

    const fullClip = `Subject: ${emailSubject}

${emailBody}`;
    await navigator.clipboard.writeText(fullClip).catch(() => {});

    await saveHistoryItem({ type:'lic', event_name: event, event, start, end, generated_key: null,
      organization: licOrg, phone: licPhone, email: licEmail, notes: licNotes, is_paid: licIsPaid, features });

  } catch(e) {
    err.textContent = t('errPrefix') + e.message;
  }

  btn.disabled = false; btn.textContent = t('genLicBtn');
}

    const keyPhone = document.getElementById('keyPhone').value.trim();
    if (!keyPhone) {
      err.textContent = t('errNeedPhone');
      document.getElementById('keyPhone').classList.add('error'); return;
    }
    const keyEmail = document.getElementById('keyEmail').value.trim();
    if (!keyEmail) {
      err.textContent = t('errNeedEmail');
      document.getElementById('keyEmail').classList.add('error'); return;
    }
  }

  btn.disabled = true; btn.textContent = t('generating');

  try {
    const key = await generateKeyStr(hwid, start, end, features);

    document.getElementById('keyResHwid').textContent  = hwid;
    document.getElementById('keyResDates').textContent = `${start}  →  ${end}  ·  ${features.join(', ')}`;
    document.getElementById('keyResKey').textContent   = key;
    document.getElementById('keyResult').className = 'result result-key show';

    // Auto copy
    await navigator.clipboard.writeText(key).catch(() => {});
    const copyBtn = document.getElementById('copyKeyBtn');
    copyBtn.textContent = t('copiedClipboard');
    copyBtn.className = 'copy-btn copied';
    setTimeout(() => { copyBtn.textContent = t('copyKeyBtn'); copyBtn.className = 'copy-btn'; }, 2000);

    const keyPhone = document.getElementById('keyPhone').value.trim();
    const keyEmail = document.getElementById('keyEmail').value.trim();
    const keyNotes = document.getElementById('keyNotes').value.trim();
    await saveHistoryItem({ type:'key', hwid, start, end, generated_key: key,
      organization: keyOrg, phone: keyPhone, email: keyEmail, notes: keyNotes, is_paid: keyIsPaid, features });
    if (keyEmail && keyIsPaid) {
      await sendLicenseEmail(keyEmail, {
        org_name:    keyOrg,
        phone:       keyPhone,
        start_date:  start,
        end_date:    end,
        machine_id:  hwid,
        license_key: key,
      });
    }
  } catch(e) {
    err.textContent = t('errPrefix') + e.message;
  }

  btn.disabled = false; btn.textContent = t('genKeyBtn');
}

function copyKey() {
  const key = document.getElementById('keyResKey').textContent;
  if (!key) return;
  navigator.clipboard.writeText(key).then(() => {
    const btn = document.getElementById('copyKeyBtn');
    btn.textContent = t('copied'); btn.className = 'copy-btn copied';
    setTimeout(() => { btn.textContent = t('copyKeyBtn'); btn.className = 'copy-btn'; }, 1500);
  });
}

// History (Supabase)
async function loadHistory() {
  const { data, error } = await sb
    .from('keygen_history')
    .select('*')
    .order('created_at', { ascending: false })
    .limit(100);
  if (error) { console.warn('History load error:', error.message); hist = []; }
  else hist = data || [];
  renderHist();
}

async function saveHistoryItem(item) {
  const row = {
    type:          item.type,
    event_name:    item.event_name || item.event || null,
    hwid:          item.hwid  || null,
    start_date:    item.start,
    end_date:      item.end,
    generated_key: item.generated_key || null,
    organization:  item.organization  || null,
    phone:         item.phone         || null,
    email:         item.email         || null,
    notes:         item.notes         || null,
    is_paid:       item.is_paid       || false,
    features:      (item.features && item.features.length ? item.features : ['competition']).join(','),
    created_by:    currentUser?.email || 'unknown'
  };
  const { error } = await sb.from('keygen_history').insert(row);
  // fails here if the features column is missing — see SETUP_GUIDE.md
  if (error) { showToast(t('toastHistSaveFail')); console.warn(error); }
  else { await loadHistory(); }
}

function toggleHist() {
  histOpen = !histOpen;
  document.getElementById('histBody').style.display = histOpen ? 'block' : 'none';
  document.getElementById('histCaret').textContent  = histOpen ? '▾' : '▸';
}

async function clearHist() {
  if (!hist.length || !confirm(t('confirmClearHist'))) return;
  await sb.from('keygen_history').delete().neq('id', 0);
  hist = [];
  renderHist();
}

function exportHist() {
  if (!hist.length) { showToast(t('toastHistEmpty')); return; }
  const json = JSON.stringify(hist, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = `neuroreplay-history-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function renderHist() {
  const body  = document.getElementById('histBody');
  const count = document.getElementById('histCount');
  count.textContent = hist.length ? `(${hist.length})` : '';
  if (!hist.length) {
    body.innerHTML = `<div class="hist-empty">${t('histEmpty')}</div>`;
    return;
  }
  body.innerHTML = hist.map((item) => {
    const label   = item.type === 'lic' ? '.LIC' : 'KEY';
    const name    = item.event_name || item.hwid || '—';
    const dates   = `${item.start_date}→${item.end_date}`;
    const who     = item.created_by ? item.created_by.split('@')[0] : '';
    const isPaid  = item.is_paid;
    const featBadge = item.features && item.features.includes('analyze')
      ? '<span class="hist-badge" style="background:rgba(124,92,252,.15);color:var(--accent)">+ANALYZE</span>' : '';
    const orgLine = [item.organization, item.phone, item.email].filter(Boolean).join(' · ');
    const notesLine = item.notes ? `<div class="hist-meta-notes">${item.notes}</div>` : '';
    const orgRow = orgLine ? `<div class="hist-meta">${orgLine}</div>` : '';
    const paidBtn = `<label class="hist-paid-label">
      <span>${isPaid ? t('paidLabel') : t('unpaidLabel')}</span>
    </label>`;
    const keyRow  = item.generated_key ? `
      <div class="hist-key-row">
        <span class="hist-key-val">${item.generated_key}</span>
        <button class="hist-copy-btn" onclick="copyHistKey(this, '${item.generated_key}')">📋</button>
      </div>` : '';
    return `
      <div class="hist-item" style="flex-direction:column;align-items:flex-start;gap:4px">
        <div style="display:flex;align-items:center;gap:7px;width:100%">
          <input type="checkbox" class="hist-select" value="${item.id}" onclick="event.stopPropagation()">
          <span class="hist-badge ${item.type==='lic'?'hist-lic':'hist-key'}">${label}</span>
          ${featBadge}
          <span class="hist-ev" title="${name}">${name}</span>
          <span class="hist-dt">${dates}</span>
          <span class="hist-user">${who}</span>
          ${paidBtn}
          <button class="hist-copy-btn" onclick="deleteHistItem(${item.id}); event.stopPropagation()">🗑</button>
        </div>
        ${keyRow}
        ${orgRow}
        ${notesLine}
      </div>`;
  }).join('');
}

async function deleteHistItem(id) {
  if (!confirm(t('confirmDeleteHistItem'))) return;

  const { error } = await sb
    .from('keygen_history')
    .delete()
    .eq('id', id);

  if (error) {
    showToast(t('toastDeleteFail'));
    console.warn(error);
    return;
  }

  showToast(t('toastDeleted'));
  await loadHistory();
}

async function deleteSelectedHist() {
  const ids = Array.from(document.querySelectorAll('.hist-select:checked'))
    .map(el => Number(el.value))
    .filter(Boolean);

  if (!ids.length) {
    showToast(t('toastSelectToDelete'));
    return;
  }

  if (!confirm(t('confirmDeleteN', ids.length))) return;

  const { error } = await sb
    .from('keygen_history')
    .delete()
    .in('id', ids);

  if (error) {
    showToast(t('toastSelectedDeleteFail'));
    console.warn(error);
    return;
  }

  showToast(t('toastSelectedDeleted'));
  await loadHistory();
}

async function togglePaid(id, currentVal) {
  const { error } = await sb
    .from('keygen_history')
    .update({ is_paid: !currentVal })
    .eq('id', id);
  if (error) { showToast(t('toastGenericError')); return; }
  await loadHistory();
}

async function deleteExpired() {
  const today = new Date().toISOString().slice(0,10);
  await sb.from('keygen_history')
    .delete()
    .lt('end_date', today)
    .eq('is_paid', false);
}

async function sendLicenseEmail(toEmail, params) {
  if (!toEmail) return;
  try {
    await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
      to_email:    toEmail,
      org_name:    params.org_name    || '—',
      phone:       params.phone       || '—',
      start_date:  params.start_date,
      end_date:    params.end_date,
      machine_id:  params.machine_id  || '—',
      license_key: params.license_key || '—',
    });
    showToast(t('toastEmailSent') + toEmail);
  } catch(e) {
    showToast(t('toastEmailFail'));
    console.warn('EmailJS error:', e);
  }
}

function toggleLicEmailSection() {
  const isPaid  = document.getElementById('licIsPaid').checked;
  const section = document.getElementById('licEmailSection');
  if (!section) return;
  section.style.display = isPaid ? 'block' : 'none';
  if (!isPaid) return;

  // Build subject/body from current form values
  const org   = document.getElementById('licOrg').value.trim();
  const phone = document.getElementById('licPhone').value.trim();
  const start = document.getElementById('licStart').value;
  const end   = document.getElementById('licEnd').value;
  const event = document.getElementById('licEvent').value.trim();

  const subject = t('emailSubject', org, event);
  const body = t('emailBody', { org, phone, start, end });

  const subjectBtn = document.getElementById('licCopySubject');
  const bodyBtn    = document.getElementById('licCopyBody');

  subjectBtn.onclick = () => {
    navigator.clipboard.writeText(subject).then(() => {
      subjectBtn.textContent = '✅ Subject';
      subjectBtn.className = 'lic-copy-part-btn copied';
      setTimeout(() => { subjectBtn.textContent = '📋 Subject'; subjectBtn.className = 'lic-copy-part-btn'; }, 1500);
    });
  };

  bodyBtn.onclick = () => {
    navigator.clipboard.writeText(body).then(() => {
      bodyBtn.textContent = '✅ Body';
      bodyBtn.className = 'lic-copy-part-btn copied';
      setTimeout(() => { bodyBtn.textContent = '📋 Body'; bodyBtn.className = 'lic-copy-part-btn'; }, 1500);
    });
  };
}

function copyHistKey(btn, key) {
  navigator.clipboard.writeText(key).then(() => {
    btn.textContent = '✅';
    setTimeout(() => btn.textContent = '📋', 1500);
  });
}

// Toast
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
